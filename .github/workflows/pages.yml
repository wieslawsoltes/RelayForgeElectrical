name: GitHub Pages
on:
  push:
    branches: [main, codex/relayforge-pages-0.2.1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build server and generated worker
        run: npm run build
      - run: npm test
      - run: npm run verify:source
      - run: npm run validate
      - run: npm run build:pages
      - run: npm run pack:libs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test browser-local Pages edition
        run: python scripts/test-pages-browser.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: warn
      - name: Archive complete tracked source
        run: git archive --format=zip --prefix=RelayForgeElectrical/ -o RelayForgeElectrical-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: relayforge-distribution
          path: |
            RelayForgeElectrical-source.zip
            dist/
            dist-pages/
            artifacts/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
