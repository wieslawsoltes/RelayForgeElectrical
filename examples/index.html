<!doctype html><html lang="en"><head><meta charset="utf-8"><title>RelayForge standalone components</title><link rel="stylesheet" href="../packages/controls/styles.css"><style>body{margin:24px;font:16px system-ui}#drawing{height:420px;position:relative;border:1px solid #ccd5df}section{display:grid;grid-template-columns:220px 1fr;gap:20px}button{padding:8px 12px;margin:10px 6px 10px 0}</style></head><body><h1>Standalone electrical canvas</h1><p>The engine, renderer and web controls run independently from the application.</p><button id="fit">Fit drawing</button><button id="add">Add a relay</button><section><rf-tree></rf-tree><div id="drawing"></div></section><script type="module">
import {createProject,createEntity,createWire,ProjectStore} from '../packages/core/index.js';
import {SchematicRenderer} from '../packages/renderer/index.js';
import {defineControls} from '../packages/controls/index.js';
defineControls();const store=new ProjectStore(createProject('Embedded design'));store.transact('Initial circuit',p=>{const page=p.pages[0];page.entities.push(createEntity(p,'push_no',300,250),createEntity(p,'coil',300,400));page.wires.push(createWire([{x:300,y:282},{x:300,y:368}]));});const renderer=new SchematicRenderer(document.querySelector('#drawing'));function update(){const p=store.project;renderer.setDocument(p,p.pages[0]);document.querySelector('rf-tree').data=p.pages[0].entities.map(e=>({id:e.id,label:e.tag+' · '+e.symbol,icon:'chip'}));}store.addEventListener('change',update);document.querySelector('rf-tree').addEventListener('itemselect',e=>{renderer.selected=new Set([e.detail.id]);renderer.invalidate();});document.querySelector('#fit').onclick=()=>renderer.fit();document.querySelector('#add').onclick=()=>store.transact('Add relay',p=>p.pages[0].entities.push(createEntity(p,'coil',500+p.pages[0].entities.length*35,350)));update();renderer.fit();
</script></body></html>
