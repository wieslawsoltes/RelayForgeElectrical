<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#192737"><meta name="description" content="RelayForge Electrical — schematic design, engineering reports and collaborative electrical projects."><title>RelayForge Electrical</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app/style.css"></head><body>
<div id="app">
<header class="titlebar"><a class="brand" href="/" aria-label="RelayForge home"><span class="brandmark">R<span>F</span></span><strong>RelayForge <span>Electrical</span></strong></a><div class="quick-access"><button data-action="save" title="Save project · Ctrl+S" aria-label="Save"></button><button data-action="undo" title="Undo · Ctrl+Z" aria-label="Undo"></button><button data-action="redo" title="Redo · Ctrl+Shift+Z" aria-label="Redo"></button></div><div class="document-title" id="title">Conveyor control system</div><div class="save-status" id="save-status">Opening project…</div><button class="title-action" id="theme" title="Switch theme" aria-label="Switch theme"></button><button class="avatar" data-action="account" aria-label="Account">WS</button></header>
<nav class="ribbon-tabs" aria-label="Ribbon"><div id="ribbon-tabs"></div><button class="command-search" data-action="commands"></button><button class="share-button" data-action="collaborate"></button></nav>
<div id="ribbon" class="ribbon"></div>
<div class="workspace">
<aside class="navigator panel" id="navigator"><div class="panel-title"><strong>Project navigator</strong><button data-action="newPage" title="New page" aria-label="New page"></button></div><div class="panel-tabs" id="nav-tabs"><button data-nav="pages" class="active">Pages</button><button data-nav="devices">Devices</button><button data-nav="symbols">Symbols</button></div><div class="filter"><span id="filter-icon"></span><input id="nav-filter" placeholder="Filter project…" aria-label="Filter navigator"><kbd>⌕</kbd></div><div class="project-root" id="project-root"></div><div id="nav-content" class="nav-content"></div><div class="navigator-foot"><span id="project-stats"></span><button data-action="projectSettings" aria-label="Project settings" title="Project settings"></button></div></aside>
<main class="drawing-main"><div class="document-tabs" id="document-tabs"></div><div class="canvas-toolbar"><div class="breadcrumbs" id="breadcrumbs"></div><div class="canvas-actions"><button data-action="fit" title="Fit page · F" aria-label="Fit page"></button><button data-action="grid" title="Toggle grid · G" aria-label="Toggle grid"></button><button data-action="toggleProperties" title="Toggle properties" aria-label="Toggle properties"></button></div></div><div id="viewport" tabindex="0" aria-label="Electrical schematic canvas. V selects, W wires, P places a symbol, Delete removes selected items."><div class="floating-tools" id="floating-tools"></div><div id="canvas-hint" class="canvas-hint">Select an object to edit · Scroll to zoom · Space + drag to pan</div><div class="zoom-control"><button data-action="zoomOut" aria-label="Zoom out">−</button><button data-action="fit" id="zoom-label">100%</button><button data-action="zoomIn" aria-label="Zoom in">+</button></div></div>
<section class="bottom-panel"><div class="bottom-tabs"><div><button data-bottom="messages" class="active">Messages <span id="issue-count">0</span></button><button data-bottom="connections">Connections</button><button data-bottom="parts">Parts list</button><button data-bottom="comments">Comments</button><button data-bottom="activity">Activity</button></div><div><button data-action="validate" class="quiet-action">Check project</button><button data-action="toggleBottom" title="Collapse panel" aria-label="Collapse panel">⌄</button></div></div><div id="bottom-content"></div></section>
</main>
<aside class="inspector panel" id="inspector"><div class="panel-title"><strong>Properties</strong><button data-action="toggleProperties" aria-label="Close properties" title="Close properties"></button></div><div id="inspector-body"></div></aside>
</div><footer class="statusbar"><span id="tool-status">Selection</span><span class="status-separator"></span><span id="coords">X 0.0&nbsp;&nbsp; Y 0.0</span><button data-action="snap" id="snap-status">SNAP ON</button><button data-action="grid">GRID 10</button><span id="page-status"></span><span class="status-spacer"></span><span id="render-status">Canvas 2D</span><span id="sync-status">Local draft</span><span>v0.2.1</span></footer>
</div><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="Close dialog">×</button></div><div id="dialog-body"></div><div id="dialog-footer"></div></dialog><div id="toast" role="status"></div><input id="file-input" type="file" accept=".json,.relayforge" hidden><script type="module" src="/app/main.js"></script></body></html>
